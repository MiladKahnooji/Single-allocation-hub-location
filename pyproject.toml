[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "single-allocation-hub-location"
version = "0.1.0"
description = "Validated matrix loading for the single-allocation hub location project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pulp>=3.0,<4",
]

[project.scripts]
salh-solve = "single_allocation_hub_location.cli:main"
salh-gvns = "single_allocation_hub_location.gvns_cli:main"

[project.optional-dependencies]
ml = ["torch>=2.4,<3"]
test = ["pytest>=8,<9", "torch>=2.4,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/single_allocation_hub_location"]
